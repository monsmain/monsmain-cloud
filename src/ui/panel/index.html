    <div id="config-modal" class="fixed inset-0 bg-black/60 hidden z-50 flex items-center justify-center p-4 opacity-0 transition-opacity duration-300"><div class="bg-white dark:bg-neutral-900 p-5 sm:p-8 rounded-3xl shadow-2xl w-full max-w-md border border-neutral-200 dark:border-neutral-800 relative transform scale-95 transition-transform duration-300" id="config-box"><button onclick="closeConfigModal()" class="absolute top-6 right-6 text-neutral-400 hover:text-neutral-600 dark:hover:text-white transition"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button><h3 class="text-xl font-bold mb-1 text-neutral-800 dark:text-white flex items-center gap-2" data-i18n="config_title">Settings</h3><p class="text-neutral-500 dark:text-neutral-400 text-xs mb-6" data-i18n="config_sub">Update your variables</p><div class="space-y-4"><div><label class="block text-xs font-bold text-neutral-500 dark:text-neutral-400 mb-1 ml-1" data-i18n="config_token">Bot Token</label><input type="text" id="cfg_token" autocomplete="off" data-i18n-ph="token_hint" class="w-full bg-neutral-50 dark:bg-neutral-950 text-neutral-800 dark:text-white px-4 py-3 rounded-xl border border-neutral-200 dark:border-neutral-800 outline-none focus:ring-2 focus:ring-orange-500 font-mono text-sm transition-all"></div><div><label class="block text-xs font-bold text-neutral-500 dark:text-neutral-400 mb-1 ml-1" data-i18n="config_chatid">Admin Chat ID</label><input type="number" id="cfg_chatid" class="w-full bg-neutral-50 dark:bg-neutral-950 text-neutral-800 dark:text-white px-4 py-3 rounded-xl border border-neutral-200 dark:border-neutral-800 outline-none focus:ring-2 focus:ring-orange-500 font-mono text-sm transition-all"></div><div><label class="block text-xs font-bold text-neutral-500 dark:text-neutral-400 mb-1 ml-1" data-i18n="cfg_r2limit">R2 storage limit (GB)</label><input type="number" id="cfg_r2limit" min="0" step="0.5" inputmode="decimal" class="w-full bg-neutral-50 dark:bg-neutral-950 text-neutral-800 dark:text-white px-4 py-3 rounded-xl border border-neutral-200 dark:border-neutral-800 outline-none focus:ring-2 focus:ring-orange-500 font-mono text-sm transition-all"></div><button onclick="saveConfig()" class="w-full bg-orange-500 hover:bg-orange-400 text-neutral-950 font-bold py-3.5 rounded-xl transition-all shadow-md mt-2 text-sm" data-i18n="config_save" id="btn_save_cfg">Save</button><p id="cfg_info" class="text-[11px] text-neutral-400 text-center font-mono pt-2"></p><p class="text-[11px] text-neutral-400 text-center" data-i18n="pwa_hint"></p></div></div></div>
    <div id="move-modal" class="fixed inset-0 bg-black/60 hidden z-50 flex items-end sm:items-center justify-center opacity-0 transition-opacity duration-200" onclick="if(event.target===this)closeMove()"><div class="sheet"><div class="flex items-center justify-between gap-3 mb-1"><h3 class="font-bold" data-i18n="move_title">Move to…</h3><button type="button" onclick="closeMove()" class="act act-icon" aria-label="Close">✕</button></div><p id="move-name" class="text-xs text-neutral-500 mb-3 truncate" dir="auto"></p><div id="move-list"></div></div></div>
<div id="select-bar" class="select-bar" role="toolbar"><span class="cnt" id="sel-count">0</span><button type="button" class="act" onclick="selectAll()"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span data-i18n="select_all">All</span></button><button type="button" id="sel-move" class="act" onclick="bulkMove()"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H20a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-1"/><path d="M2 13h10"/><path d="m9 16 3-3-3-3"/></svg><span data-i18n="move">Move</span></button><button type="button" id="sel-delete" class="act act-danger" onclick="bulkDelete()"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg><span data-i18n="delete">Delete</span></button><button type="button" class="act act-icon" onclick="toggleSelect(false)" aria-label="Cancel">✕</button></div>
<div id="toast" role="status" aria-live="polite"><span id="toast-icon">✓</span><span id="toast-msg"></span></div>

    <script>@@INCLUDE ui/panel/app.js@@</script>
</body>
</html>
